[workspace]
resolver = "3"
members = ["crates/rsympy-num", "crates/rsympy-ntheory", "crates/rsympy"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kpauldueck/RustSympyRewrite"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The differential and conformance tests do real big-number work; unoptimised
# builds make them needlessly slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
